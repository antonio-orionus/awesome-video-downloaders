name: Refresh board data

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-board-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh stars, last push, and licenses
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/refresh-board-data.py --strict

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- readme.md; then
            echo "No changes to commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add readme.md
            git commit -m "chore: refresh board stars and last-push dates"
            git push
          fi
